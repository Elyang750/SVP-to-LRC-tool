<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVP转LRC工具</title>
    <link rel="stylesheet" href="css/utils/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/file-upload.css">
    <link rel="stylesheet" href="css/components/time-input.css">
    <link rel="stylesheet" href="css/components/lyric-input.css">
    <link rel="stylesheet" href="css/components/svp-info.css">
      <!-- ▼ 新增：轨道选择器 & 匹配报告的最小样式（只影响新元素） -->
    <style>
        .track-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .track-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; border: 1px solid #dfe4ec; border-radius: 8px;
            cursor: pointer; user-select: none; transition: all .15s;
        }
        .track-item:hover { border-color: #4a90e2; background: #f5faff; }
        .track-item.selected { border-color: #4a90e2; background: #e8f2fd;
            box-shadow: 0 0 0 2px rgba(74,144,226,.15); }
        .track-item .track-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .track-item .track-checkbox {
            width: 18px; height: 18px; border: 2px solid #c8d0dc; border-radius: 4px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #fff; transition: all .15s;
        }
        .track-item.selected .track-checkbox { background: #4a90e2; border-color: #4a90e2; }
        .track-item.selected .track-checkbox::after { content: '✓'; }
        .track-item .track-name { font-weight: 500; }
        .track-item .track-path { color: #95a5a6; font-size: 11px; font-family: monospace; }
        .track-item .track-count { color: #95a5a6; font-size: 12px; white-space: nowrap; }

        .report-summary { font-size: 13px; color: #576574; margin: 8px 0; }
        .report-summary .tag { display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 12px; margin-right: 6px; }
        .report-summary .tag.high { background: #e8f8ee; color: #1d8a4a; }
        .report-summary .tag.mid { background: #fef5e7; color: #b9770e; }
        .report-summary .tag.low { background: #fdecea; color: #c0392b; }
        .report-list { max-height: 420px; overflow-y: auto;
            border: 1px solid #dfe4ec; border-radius: 8px; background: #fafbfd; }
        .report-row { padding: 8px 12px; border-bottom: 1px solid #eef1f6; font-size: 13px; }
        .report-row:last-child { border-bottom: none; }
        .report-row .report-line1 { display: flex; align-items: center; gap: 10px;
            font-family: "SF Mono", Menlo, Consolas, monospace; }
        .report-row .report-time { color: #7f8c8d; flex-shrink: 0; min-width: 78px; }
        .report-row .report-text { flex: 1; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
        .report-row .report-sim { flex-shrink: 0; font-weight: 600; min-width: 46px;
            text-align: right; }
        .report-row.high .report-sim { color: #1d8a4a; }
        .report-row.mid { background: #fffbf2; }
        .report-row.mid .report-sim { color: #b9770e; }
        .report-row.low { background: #fef6f5; }
        .report-row.low .report-sim { color: #c0392b; }
        .report-row .report-compare { font-family: monospace; font-size: 11px;
            color: #95a5a6; margin-top: 3px; line-height: 1.5;
            white-space: pre-wrap; word-break: break-all; }
        .report-row.high .report-compare { display: none; }
        .report-row:hover .report-compare { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SVP转LRC工具</h1>
        
        <!-- 文件上传区域 -->
        <div id="fileUploadContainer"></div>
        
        <!-- 时间偏移设置 -->
        <div id="timeOffsetContainer"></div>
        
        <!-- 歌词选择 -->
        <div id="lyricSelectionContainer"></div>
        
        <!-- 生成按钮 -->
        <button id="generateBtn">生成并下载LRC文件</button>
        
        <!-- SVP解析信息展示区 -->
        <div id="svpInfoContainer"></div>
       
        <!-- ▼ 新增：轨道选择器（多轨/多音符组时出现） -->
        <div id="trackSelectorContainer"></div>
     
        <!-- ▼ 新增：匹配报告（生成后出现，仅日语匹配时显示） -->
        <div id="matchReportContainer"></div>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
